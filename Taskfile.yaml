version: "3"

vars:
  CLUSTER: kong-observability-demo
  KONG_NS: kong
  MON_NS: observability
  KONG_RELEASE: kong
  MON_RELEASE: kube-prometheus-stack    # name MUST be this - Prometheus only watches
                                        # ServiceMonitors with label release: kube-prometheus-stack

  # ── Pinned chart versions (latest as of 2026-11-05). Every helm install
  # uses --version, so the stack installs the same way next month.
  KUBE_PROMETHEUS_STACK_CHART_VERSION: 92.21.1   # Prometheus 3.16.0, Grafana 13.3.0, Operator v0.94.2
  LOKI_CHART_VERSION: 7.5.0                     # Loki 3.6.11
  TEMPO_CHART_VERSION: 1.24.4                   # Tempo 2.9.0
  OTEL_COLLECTOR_CHART_VERSION: 0.178.2         # otelcol-contrib 0.163.2
  ALLOY_CHART_VERSION: 1.15.0                   # Alloy v1.21.3
  METALLB_CHART_VERSION: 0.16.2                 # MetalLB v0.16.2
  KONG_CHART_VERSION: 3.4.1                     # Kong Gateway image pinned separately via KONG_IMAGE_TAG in .env

dotenv: [".env"]

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ── The four commands ───────────────────────────────────────────────
  up:
    desc: "Create the cluster, observability stack, Konnect control plane and Kong data plane, then send test traffic"
    cmds:
      - task: helm-repos
      - task: cluster
      - task: metallb
      - task: prometheus-stack
      - task: loki
      - task: tempo
      - task: otel-collector
      - task: alloy
      - task: konnect-setup
      - task: kong-dp-install
      - task: deck-apply
      - task: generate-traffic
      - task: urls

  test:
    desc: "Send traffic, then check that metrics, traces and both log streams arrived"
    cmds:
      - task: generate-traffic
      - echo "Waiting 20s for the signals to land..." && sleep 20
      - bash validate.sh {{.MON_NS}}
      - task: urls

  down:
    desc: "Delete the kind cluster (keeps the Konnect control plane, so 'task up' reuses it)"
    cmds:
      - kind delete cluster --name {{.CLUSTER}}

  clean:
    desc: "Delete the kind cluster and the Konnect control plane"
    cmds:
      - task: down
      - task: konnect-teardown
      - rm -f values-dp.yaml

  # ── Helm repos ──────────────────────────────────────────────────────
  helm-repos:
    internal: true
    desc: "Add (or refresh) the Helm repos this stack installs from"
    cmds:
      - helm repo add kong https://charts.konghq.com --force-update
      - helm repo add grafana https://grafana.github.io/helm-charts --force-update
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - helm repo add metallb https://metallb.github.io/metallb --force-update
      - helm repo update kong grafana open-telemetry prometheus-community metallb

  # ── Cluster + networking ────────────────────────────────────────────
  cluster:
    internal: true
    desc: "Create kind cluster and namespaces"
    status:
      - kind get clusters | grep -qx "{{.CLUSTER}}"
    cmds:
      - kind create cluster --name {{.CLUSTER}}
      - kubectl config use-context kind-{{.CLUSTER}}
      - kubectl create namespace {{.MON_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace {{.KONG_NS}} --dry-run=client -o yaml | kubectl apply -f -

  metallb:
    internal: true
    desc: "Install MetalLB so LoadBalancer Services get real IPs (no port-forward needed)"
    cmds:
      - helm upgrade --install metallb metallb/metallb -n metallb-system --create-namespace
          --version {{.METALLB_CHART_VERSION}} --wait --timeout 3m
      - kubectl -n metallb-system wait --for=condition=available --timeout=90s deployment/metallb-controller
      - |
        if [ -z "${METALLB_RANGE:-}" ]; then
          METALLB_RANGE=$(docker network inspect kind --format json | python3 -c '
        import ipaddress, json, sys
        nets = [ipaddress.ip_network(c["Subnet"]) for c in json.load(sys.stdin)[0]["IPAM"]["Config"]]
        n = next(n for n in nets if n.version == 4)
        top = int(n.broadcast_address)
        print(f"{ipaddress.ip_address(top - 55)}-{ipaddress.ip_address(top - 25)}")')
        fi
        echo "MetalLB pool: ${METALLB_RANGE}"
        export METALLB_RANGE
        envsubst '${METALLB_RANGE}' < metallb-config.yaml | kubectl apply -f -

  # ── Observability stack ─────────────────────────────────────────────
  prometheus-stack:
    internal: true
    desc: "kube-prometheus-stack (Prometheus + Grafana + Operator) - release name MUST match MON_RELEASE"
    cmds:
      - helm upgrade --install {{.MON_RELEASE}} prometheus-community/kube-prometheus-stack
          -n {{.MON_NS}} -f values-prometheus-stack.yaml
          --version {{.KUBE_PROMETHEUS_STACK_CHART_VERSION}} --wait --timeout 5m

  loki:
    internal: true
    desc: "Loki - log store, native OTLP ingest"
    cmds:
      - helm upgrade --install loki grafana/loki -n {{.MON_NS}} -f values-loki.yaml
          --version {{.LOKI_CHART_VERSION}} --wait --timeout 5m

  tempo:
    internal: true
    desc: "Tempo - trace store"
    cmds:
      - helm upgrade --install tempo grafana/tempo -n {{.MON_NS}} -f values-tempo.yaml
          --version {{.TEMPO_CHART_VERSION}} --wait --timeout 5m

  otel-collector:
    internal: true
    desc: "OTel Collector - Kong's OTLP traces+logs land here, tail-sampled to Tempo, forwarded to Loki"
    cmds:
      - helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
          -n {{.MON_NS}} -f values-otel-collector.yaml
          --version {{.OTEL_COLLECTOR_CHART_VERSION}} --wait --timeout 5m

  alloy:
    internal: true
    desc: "Grafana Alloy - DaemonSet tailing Kong's raw pod stdout/stderr into Loki as {namespace=\"kong\"}"
    cmds:
      - helm upgrade --install alloy grafana/alloy -n {{.MON_NS}} -f values-alloy.yaml
          --version {{.ALLOY_CHART_VERSION}} --wait --timeout 5m

  # ── Konnect + Kong DP ───────────────────────────────────────────────
  konnect-setup:
    internal: true
    desc: "Create a real Konnect control plane + DP client cert, write values-dp.yaml"
    cmds:
      - bash konnect-setup.sh

  kong-dp-install:
    internal: true
    desc: "Install Kong DP (Konnect hybrid mode, image tag set via KONG_IMAGE_TAG in .env)"
    cmds:
      - helm upgrade --install {{.KONG_RELEASE}} kong/kong -n {{.KONG_NS}} -f values-dp.yaml
          --version {{.KONG_CHART_VERSION}} --wait --timeout 5m

  konnect-teardown:
    internal: true
    desc: "Delete the Konnect control plane created by konnect-setup"
    cmds:
      - |
        CP_ID=$(python3 -c 'import json;print(json.load(open("certs/control-plane.json"))["id"])')
        echo "Deleting Konnect control plane $CP_ID ..."
        curl -sS -X DELETE "https://${KONNECT_SERVER_URL}/v2/control-planes/$CP_ID" \
          -H "Authorization: Bearer ${KONNECT_TOKEN}" --fail-with-body
        rm -f certs/control-plane.json certs/dp-cert-upload.json

  # ── Kong config ──────────────────────────────────────────────────────
  deck-apply:
    internal: true
    desc: "Push service/route + prometheus/opentelemetry plugins via decK against Konnect"
    cmds:
      - |
        deck gateway sync kong.yaml \
          --konnect-addr "https://${KONNECT_SERVER_URL}" \
          --konnect-token "${KONNECT_TOKEN}" \
          --konnect-control-plane-name "${CONTROL_PLANE_NAME}"

  # ── Traffic + validation ────────────────────────────────────────────
  generate-traffic:
    internal: true
    desc: "Send test traffic to the DP's proxy LoadBalancer IP, from the kind node (works even when the host can't route to MetalLB IPs)"
    cmds:
      - |
        PROXY_IP=$(kubectl -n {{.KONG_NS}} get svc {{.KONG_RELEASE}}-kong-proxy -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        for i in $(seq 1 10); do
          docker exec {{.CLUSTER}}-control-plane curl -sk -o /dev/null -w "%{http_code} " "https://${PROXY_IP}/mock/anything"
          sleep 0.3
        done
        echo

  urls:
    internal: true
    desc: "Print direct IPs for Grafana/Prometheus/Kong proxy (MetalLB, no port-forward)"
    cmds:
      - 'echo "Grafana:    http://$(kubectl -n {{.MON_NS}} get svc {{.MON_RELEASE}}-grafana -o jsonpath="{.status.loadBalancer.ingress[0].ip}")  admin / $(kubectl -n {{.MON_NS}} get secret {{.MON_RELEASE}}-grafana -o jsonpath="{.data.admin-password}" | base64 --decode)"'
      - 'echo "Prometheus: http://$(kubectl -n {{.MON_NS}} get svc {{.MON_RELEASE}}-prometheus -o jsonpath="{.status.loadBalancer.ingress[0].ip}"):9090"'
      - 'echo "Kong proxy: https://$(kubectl -n {{.KONG_NS}} get svc {{.KONG_RELEASE}}-kong-proxy -o jsonpath="{.status.loadBalancer.ingress[0].ip}")"'
