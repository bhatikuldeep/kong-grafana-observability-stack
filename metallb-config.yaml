# Rendered by `task up`: ${METALLB_RANGE} is a block near the top of the
# Docker "kind" network's IPv4 subnet (for 192.168.107.0/24: .200-.230), so
# LoadBalancer IPs sit on the same network as the kind node. To pick another
# block (another kind cluster's pool uses it), set METALLB_RANGE in .env.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kong-observability-demo-pool
  namespace: metallb-system
spec:
  addresses:
    - ${METALLB_RANGE}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kong-observability-demo-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - kong-observability-demo-pool
