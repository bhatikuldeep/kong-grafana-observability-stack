# OTel Collector — terminates Kong's OTLP/HTTP on :4318, tail-samples traces
# into Tempo, forwards access logs to Loki's native OTLP ingest. The
# -contrib image is required for the tail_sampling processor.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib

config:
  extensions:
    # Mandatory per current chart — removing it fails liveness/readiness probes.
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
    # Chart default adds a `prometheus` self-scrape receiver on :8888 — not
    # wired into any pipeline here (service.pipelines only lists otlp).

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 5s
      send_batch_size: 1024
    # Keep every error/slow trace; sample the baseline at 100% so every
    # log's "View trace" link resolves. In production, lower the baseline
    # sampling percentage to reduce storage cost — accept that some trace
    # links won't resolve in exchange for lower Tempo ingest volume.
    tail_sampling:
      decision_wait: 10s
      policies:
        - name: errors
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: slow
          type: latency
          latency:
            threshold_ms: 500
        - name: baseline
          type: probabilistic
          probabilistic:
            sampling_percentage: 100

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki-gateway.observability.svc.cluster.local/otlp

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
